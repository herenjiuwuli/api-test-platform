name: CI

# M19：把分层的测试接进 CI 做回归（现为五层）
#   ① 静态扫描（前端未声明标识符等 —— 拦「build 过、真机一跑就 ReferenceError」）
#   ①b 静态扫描（文档引用 —— README / docs / CI 里引用的文件必须真的存在）
#   ② 构建（后端要托管 web/dist，E2E 依赖它）
#   ③ 接口测试（vitest，211 条：鉴权 / 断言引擎 / 链路 / 环境 / 分组 / 通知 / 响应头 / query）
#   ④ UI 测试（Playwright，11 条：路由守卫 / 真实登录 / 单条与分组运行 / 报告 / 增删）
#   ⑤ 真机断言（自写零依赖 CDP 脚本 m11 + m12：套件导入导出 / 用例分组）
#
# ⚠️ 条数**刻意不写死在这**：写死必然烂 —— 旧值「43 条」= 19+24，而 m12 加了自包含对照数据后
#    已是 26（合计 45），注释却一路没跟上。现在运行时由 run-ui-check.mjs 按 `check(` 现数并打印。
#
# ⚠️ 为什么 ④ 和 ⑤ 都要留着（不是重复）：④ 是标准框架（自动等待 / 重试 / trace / 报告），
#   ⑤ 是零依赖直连 CDP。两者覆盖面不一样 —— ⑤ 额外覆盖了 **套件往返（含脱敏、三种冲突策略）
#   与分组（含负向对照：查无此组必须一条都不跑）**。之前 ⑤ 根本没进 CI，等于这两块在 UI 层零回归保护。
#   （m9 / m10 是跨系统联调：要 office-oa 在 3200 且平台里有 seed:oa 数据，CI 里没有，故不进 CI；
#     m13 是截图导览，产物 shots/ 刻意不进仓库，也不是断言门禁。）
#
# ⭐ 不下载浏览器：playwright.config.js 配了 channel: 'chrome'，
#    用 GitHub runner（ubuntu-latest 镜像自带 Google Chrome stable）已装的 Chrome，省掉几百 MB 下载。
#    ⑤ 的脚本同样复用系统 Chrome（scripts/lib/cdp.mjs 的 findChrome 会找 /usr/bin/google-chrome），
#    所以同样不需要任何浏览器下载步骤。
#
# 顺序不能乱：静态扫描要在构建前（构建只为产物，扫描抓的是源码问题）；
#            构建必须在 E2E 与 ⑤ 前（两者打的都是构建后的 web/dist）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 装依赖（根目录 + web 各自一份 lock）
        run: |
          npm ci
          npm --prefix web ci

      - name: ① 静态扫描（前端）
        run: npm run check:frontend

      - name: ①b 静态扫描（文档引用）—— 文档里引用的文件必须真的存在
        # 实测抓到过：README 目录清单把前端文件写成 `src/views/Login.vue`，  # refcheck-ignore
        # 而仓库根的 `src/` 是后端 —— 引用"能对上"却指向另一个文件。
        run: npm run check:docs

      - name: ② 构建前端产物
        run: npm run build

      - name: ③ 接口测试（vitest）
        run: npm test

      - name: ④ UI 测试（Playwright，用系统 Chrome）
        run: npm run test:e2e

      - name: ⑤ 真机断言（自写零依赖 CDP 脚本 m11 + m12：覆盖套件往返与用例分组）
        # 与本地跑的是**同一条命令**：它自己备隔离环境（data/ui-check.db + 3111 端口）、
        # 自己起服务、跑完自己收。这样就不会出现「本地一套逻辑、CI 另一套」各自漂移。
        run: npm run check:ui:auto

      - name: 失败时上传 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

services:
  api-test-platform:
    build: .
    image: api-test-platform:latest
    container_name: api-test-platform
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      # ⚠️ 生产务必改成你自己的长随机字符串（否则 token 可被伪造）
      - JWT_SECRET=请改成你自己的长随机字符串至少32位
    volumes:
      # 持久化 SQLite 数据库（重启不丢数据）
      - ./data:/app/data
    restart: unless-stopped
